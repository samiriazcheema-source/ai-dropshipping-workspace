      const report = (message) => {
        window.__auraRuntimeIssue = String(message || "Unknown runtime issue");
        window.dispatchEvent(new CustomEvent("aura-runtime-issue", { detail: { message: window.__auraRuntimeIssue } }));
      };
      window.addEventListener("error", (event) => report(event.error?.message || event.message));
      window.addEventListener("unhandledrejection", (event) => report(event.reason?.message || event.reason));
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch((error) => report(`Service worker unavailable: ${error.message}`));
        }, { once: true });
      }
      const nativeFetch = window.fetch?.bind(window);
      if (nativeFetch) {
        window.fetch = async (input, init = {}) => {
          const maxAttempts = Number.isFinite(init.auraRetries) ? Math.max(0, Math.min(3, init.auraRetries)) : 2;
          let lastError;
          for (let attempt = 0; attempt <= maxAttempts; attempt += 1) {
            try {
              const response = await nativeFetch(input, init);
              if (response.ok || response.status < 500 || attempt === maxAttempts) return response;
              lastError = new Error(`Request failed with HTTP ${response.status}`);
            } catch (error) {
              lastError = error;
              if (attempt === maxAttempts) throw error;
            }
            await new Promise((resolve) => setTimeout(resolve, 250 * (attempt + 1)));
          }
          throw lastError || new Error("Request failed");
        };
      }
    })();

    function WeatherBriefing({notify}) {const [location,setLocation]=useState("Lahore"),[data,setData]=useState(null),[loading,setLoading]=useState(false),[error,setError]=useState(""),[lang,setLang]=useState("Roman Urdu + English"); const fetchWeather=async()=>{setLoading(true);setError("");try{const g=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`);if(!g.ok)throw Error("Geocoding failed");const gj=await g.json();if(!gj.results?.length)throw Error("Location not found");const place=gj.results[0];const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);if(!w.ok)throw Error("Weather request failed");setData({place,...await w.json()});}catch(e){setError(e.message+". Check your spelling or connection.");}finally{setLoading(false);}}; const speak=()=>{if(!data||!window.speechSynthesis)return;const t=`Weather in ${data.place.name}: ${Math.round(data.current.temperature_2m)} degrees. High ${Math.round(data.daily.temperature_2m_max[0])}, low ${Math.round(data.daily.temperature_2m_min[0])}.`;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));}; return <><SectionTitle eyebrow="Live data" title="Weather & daily briefing" action={<span className="text-xs text-slate-500">Open-Meteo ? real browser fetch</span>}/><div className="glass rounded-2xl p-5"><div className="flex flex-wrap gap-3"><input className={inputClass+" max-w-sm"} value={location} onChange={e=>setLocation(e.target.value)} placeholder="City or town"/><button onClick={fetchWeather} disabled={loading} className="rounded-xl bg-gradient-to-r from-violet-500 to-indigo-500 px-5 py-2.5 text-sm font-semibold">{loading?"Loading?":"Fetch live weather"}</button><select className="rounded-lg border bo
